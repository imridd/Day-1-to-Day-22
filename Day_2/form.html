<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>Join Our Team</h1>
    <form>
        <label for="name">Full Name: <span>*</span></label><br>
        <input type="text" placeholder="Your Name" required>
        <br><br>
        <label for="email">Email Address: <span>*</span></label><br>
        <input type="email" placeholder="you@company.com" required>
        <br><br>
        <input type="submit" class="submit-btn" value="Submit Application">
    </form>
    <br><br>
    <h2>Recent Hires</h2>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Department</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Alex Carter</td>
                <td>Engineering</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Priya Singh</td>
                <td>Design</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Marcus Lee</td>
                <td>Marketing</td>
            </tr>
        </tbody>

    </table>
</body>

</html>
